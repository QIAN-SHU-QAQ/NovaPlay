name: PR policy controller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_run:
    workflows: [CI, Review signal]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-policy-controller
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
    steps:
      # Never check out a PR head in this privileged workflow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const reconcile = require('./.github/automation/reconcile.cjs');
            await reconcile({ github, context, core });
